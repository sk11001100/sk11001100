<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lei Kai · Mission Log</title>
<meta name="description" content="Lei Kai, senior full-stack engineer. A career told as a real space mission: from low Earth orbit, past the planets, to the edge of a black hole.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root{--ink:#f4f6fa;--dim:rgba(224,231,242,.76);--faint:rgba(196,208,226,.52);--line:rgba(214,226,242,.2);--acc:#a9d9ff;--sun:#ffc88f;--fd:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--fm:'IBM Plex Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:#000;color:var(--ink);font-family:var(--fd);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(169,217,255,.3);color:#fff}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;background:#000}
#track{position:relative;width:1px;visibility:hidden;pointer-events:none}

/* ---- text that lives in space ---- */
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;width:min(780px,90vw);text-align:center;opacity:0;visibility:hidden;will-change:transform,opacity,filter;pointer-events:none;text-shadow:0 0 24px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.6)}
.lab.on{pointer-events:auto}
.kick{font-family:var(--fm);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);margin-bottom:20px}
.kick b{font-weight:500;color:var(--acc)}
.name{font-weight:200;font-size:clamp(52px,10.4vw,172px);letter-spacing:.34em;margin-right:-.34em;line-height:.92;color:#fff}
.role{font-family:var(--fm);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-top:26px}
h2{font-weight:300;font-size:clamp(34px,4.6vw,72px);line-height:1.03;letter-spacing:-.026em;color:#fff}
h2 em{font-style:normal;color:var(--dim)}
.sub{font-family:var(--fm);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:18px}
.p{font-size:clamp(15px,1.12vw,17px);line-height:1.72;color:var(--dim);max-width:560px;margin:20px auto 0}
.sci{font-family:var(--fm);font-size:10.5px;line-height:1.75;letter-spacing:.06em;color:var(--faint);margin:24px auto 0;max-width:520px}
.sci::before{content:'';display:inline-block;width:18px;height:1px;background:currentColor;vertical-align:middle;margin-right:10px;opacity:.8}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:22px}
.chips span{font-family:var(--fm);font-size:10px;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:5px 9px;background:rgba(0,0,0,.4)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:26px;margin-top:22px}
.links a{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-decoration:none;border-bottom:1px solid var(--line);padding:5px 0;transition:border-color .3s}
.links a:hover{border-color:var(--acc)}
.n{font-family:var(--fm);font-size:10px;letter-spacing:.3em;color:var(--acc);margin-bottom:14px}
.rule{font-weight:300;font-size:clamp(28px,3.4vw,52px);line-height:1.1;letter-spacing:-.02em;color:#fff}
.rule em{display:block;font-style:normal;font-size:.42em;letter-spacing:0;color:var(--dim);margin-top:12px;font-weight:400}
.disc{font-weight:200;font-size:clamp(40px,4.8vw,76px);line-height:1;letter-spacing:-.02em;color:#fff}
.tools{font-family:var(--fm);font-size:11px;letter-spacing:.1em;line-height:2;color:var(--dim);max-width:440px;margin:14px auto 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin:36px auto 0;max-width:720px}
.stats b{display:block;font-weight:200;font-size:clamp(42px,4.8vw,74px);line-height:1;letter-spacing:-.03em;color:#fff}
.stats span{display:block;font-family:var(--fm);font-size:9.5px;line-height:1.55;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:10px}
.contacts{display:grid;max-width:480px;margin:28px auto 0;background:rgba(0,0,0,.46);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);padding:2px 20px;text-shadow:none}
.contacts a,.contacts button{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:14px;padding:15px 0;border:0;border-top:1px solid var(--line);background:none;color:#fff;font:inherit;text-align:left;text-decoration:none}
.contacts>:first-child{border-top:0}
.contacts span{font-family:var(--fm);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.contacts b{font-weight:400;font-size:15px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contacts i{font-family:var(--fm);font-style:normal;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.end{font-size:clamp(40px,5.6vw,92px)}
.foot{font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:40px;line-height:2.1}
.foot button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:#fff;background:none;border:1px solid var(--line);padding:9px 16px;margin-bottom:22px}
.foot small{display:block;font-size:9px;letter-spacing:.12em;opacity:.8}

/* ---- telemetry ---- */
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;font-family:var(--fm);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);transition:opacity 1.2s}
#hud>div{position:absolute;white-space:nowrap}
.tl{left:28px;top:24px;display:flex;align-items:center;gap:14px;color:var(--dim)}
.tl .patch{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;font-size:8.5px;letter-spacing:.08em;color:#fff}
.tl b{font-weight:400;color:#fff}
.tr{right:28px;top:24px;text-align:right;line-height:2}
.st{display:inline-block;width:5px;height:5px;border-radius:50%;background:#7ef0b0;box-shadow:0 0 10px #7ef0b0;margin-right:10px;vertical-align:1px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.bl{left:28px;bottom:26px;line-height:2}
.bl #tgt{color:#fff;letter-spacing:.16em}
.br{right:28px;bottom:26px}
#tel{display:grid;grid-template-columns:auto auto;column-gap:22px;row-gap:5px;text-align:right}
#tel dt{color:var(--faint)}
#tel dd{color:#fff;letter-spacing:.1em;font-variant-numeric:tabular-nums;min-width:118px}
#bar{left:0;right:0;bottom:0;height:1px;background:rgba(255,255,255,.06)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(169,217,255,.2),var(--acc))}
#evt{left:50%;top:26px;transform:translateX(-50%);color:var(--acc);opacity:0;transition:opacity .6s;letter-spacing:.28em}
#hint{left:50%;bottom:44px;transform:translateX(-50%);text-align:center;color:var(--dim);transition:opacity .8s;opacity:0}
#hint i{display:block;width:1px;height:38px;margin:12px auto 0;background:linear-gradient(var(--acc),transparent);animation:drop 2.4s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---- route map ---- */
#route{position:fixed;right:30px;top:50%;transform:translateY(-50%);z-index:4;display:grid;gap:4px}
#route button{position:relative;display:block;width:16px;height:16px;background:none;border:0;padding:0}
#route button::before{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--faint);transition:transform .35s,background .35s}
#route button.on::before{background:var(--acc);transform:scale(1.9);box-shadow:0 0 8px var(--acc)}
#route button.past::before{background:rgba(255,255,255,.75)}
#route span{position:absolute;right:24px;top:50%;transform:translate(6px,-50%);font-family:var(--fm);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#fff;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-shadow:0 0 10px #000}
#route button:hover span,#route button.on span{opacity:1;transform:translate(0,-50%)}
#route button.on span{color:var(--acc)}

/* ---- cursor: solid, never blended, tracked every frame ---- */
#cur{position:fixed;left:0;top:0;width:0;height:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .3s}
#cur .pt{position:absolute;left:0;top:0;will-change:transform}
#cur .dot{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#cur .ring{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s,border-color .3s}
#cur .lock{position:absolute;left:0;top:0;width:0;height:0;opacity:0;will-change:transform,width,height;transition:opacity .25s;--c:var(--acc);background:
linear-gradient(var(--c),var(--c)) 0 0/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1px 12px no-repeat,
linear-gradient(var(--c),var(--c)) 100% 0/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1px 12px no-repeat,
linear-gradient(var(--c),var(--c)) 0 100%/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1px 12px no-repeat,
linear-gradient(var(--c),var(--c)) 100% 100%/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1px 12px no-repeat}
#cur .lock::after{content:attr(data-tag);position:absolute;right:0;top:-18px;font-family:var(--fm);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);text-shadow:0 0 8px #000}
#cur.link .ring{transform:scale(.3);opacity:0}
#cur.link .lock{opacity:1}
#cur.text .ring{transform:scale(.55);border-color:rgba(169,217,255,.9)}
#cur.down .ring{transform:scale(.7)}
html.cursor,html.cursor *{cursor:none!important}
html.cursor #cur.live{opacity:1}

/* ---- preloader ---- */
#pre{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;transition:opacity 1.4s ease,visibility 1.4s}
#pre.off{opacity:0;visibility:hidden}
#pre div{font-family:var(--fm);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);text-align:center}
#pre b{display:block;font-weight:400;font-size:12px;color:#fff;margin-top:14px;letter-spacing:.2em}
#pre i{display:block;width:180px;height:1px;background:rgba(255,255,255,.1);margin:18px auto 0;overflow:hidden}
#pre i::after{content:'';display:block;height:100%;width:var(--p,0%);background:var(--acc);transition:width .3s}

/* ---- no WebGL: plain readable page ---- */
html.nogl #gl,html.nogl #hud,html.nogl #route,html.nogl #track,html.nogl #cur{display:none}
html.nogl #labels{position:static;overflow:visible;padding:12vh 0}
html.nogl .lab{position:relative;left:auto;top:auto;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;margin:0 auto 18vh;pointer-events:auto}
html.nogl body{background:radial-gradient(ellipse at 50% 0,#0b1424,#000 70%) fixed}

@media (max-width:760px){
  .tl{left:18px;top:18px}.tl .patch{width:30px;height:30px}
  .tr,#route,#evt{display:none}
  .bl{left:18px;bottom:18px}.br{right:18px;bottom:18px}
  #tel{grid-template-columns:auto;row-gap:2px}#tel dt{display:none}#tel dd{min-width:0}
  #tel>div:nth-child(n+3){display:none}
  .stats{grid-template-columns:repeat(2,1fr);gap:26px 14px}
  .contacts{padding:2px 14px}.contacts a,.contacts button{grid-template-columns:64px 1fr auto;gap:10px}
  .contacts b{font-size:13.5px}
  .name{letter-spacing:.22em;margin-right:-.22em}
  .lab{width:88vw}
  #hint{bottom:64px}
}
@media (prefers-reduced-motion:reduce){#hint i,.st{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="labels"></div>

<div id="hud" aria-hidden="true">
  <div class="tl"><span class="patch">LK-17</span><span><b>Lei Kai</b> · Mission log</span></div>
  <div class="tr"><span class="st"></span>Open to lead roles<br><span id="clk">--:--</span> · Xianyang</div>
  <div id="evt"></div>
  <div class="bl"><div>Phase <span id="phn">01</span> / <span id="pht">12</span></div><div id="tgt">Low Earth orbit</div></div>
  <div class="br"><dl id="tel">
    <div><dt id="k0">Year</dt><dd id="v0">2017.00</dd></div>
    <div><dt id="k1">From Sun</dt><dd id="v1">1.00 AU</dd></div>
    <div><dt id="k2">Velocity</dt><dd id="v2">7.66 km/s</dd></div>
    <div><dt id="k3">Signal delay</dt><dd id="v3">1.4 ms</dd></div>
  </dl></div>
  <div id="hint">Scroll to launch<i></i></div>
  <div id="bar"><i></i></div>
</div>
<nav id="route" aria-label="Mission route"></nav>
<div id="cur" aria-hidden="true"><i class="lock"></i><div class="pt"><i class="ring"></i><i class="dot"></i></div></div>
<div id="pre"><div>Acquiring signal<b id="pct">0%</b><i></i></div></div>
<div id="track"></div>

<script type="module">
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
const mobile = matchMedia('(max-width:760px)').matches || matchMedia('(pointer:coarse)').matches;
const low = mobile || (navigator.hardwareConcurrency || 8) <= 4;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const finePointer = matchMedia('(pointer:fine)').matches && !mobile;
let W = innerWidth, H = innerHeight;

if (Q.has('debug')) {
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;left:0;top:0;z-index:99;max-width:100vw;max-height:60vh;overflow:auto;font:11px monospace;color:#f88;background:rgba(0,0,0,.85);white-space:pre-wrap';
  document.body.appendChild(box);
  const log = (...a) => { box.textContent += a.map(String).join(' ').slice(0, 3000) + '\n'; };
  const ce = console.error.bind(console); console.error = (...a) => { log(...a); ce(...a); };
  addEventListener('error', e => log('ERR', e.message, e.filename, e.lineno));
  addEventListener('unhandledrejection', e => log('REJ', e.reason && (e.reason.stack || e.reason)));
}

/* =========================================================
   The mission. Each station: dwell (dw) and transit to next (tr),
   in "screens" of scroll.
   ========================================================= */
const ST = [
  {id:'earth',   nav:'Earth',        tgt:'Low Earth orbit · Xianyang', dw:1.9, tr:1.1},
  {id:'moon',    nav:'Moon',         tgt:'Lunar flyby',                dw:1.6, tr:1.2},
  {id:'mars',    nav:'Mars',         tgt:'Mars',                       dw:1.7, tr:0.8},
  {id:'belt',    nav:'Asteroid belt',tgt:'Main asteroid belt',         dw:2.6, tr:0.9},
  {id:'jupiter', nav:'Jupiter',      tgt:'Jupiter · gravity assist',   dw:2.0, tr:1.2},
  {id:'saturn',  nav:'Saturn',       tgt:'Saturn',                     dw:1.8, tr:1.2},
  {id:'neptune', nav:'Neptune',      tgt:'Neptune',                    dw:1.8, tr:0.8},
  {id:'kuiper',  nav:'Kuiper belt',  tgt:'Kuiper belt',                dw:2.7, tr:0.8},
  {id:'helio',   nav:'Heliopause',   tgt:'Heliopause',                 dw:1.7, tr:0.3},
  {id:'warp',    nav:'Interstellar', tgt:'Interstellar cruise',        dw:1.7, tr:0.3},
  {id:'bh',      nav:'Cygnus X-1',   tgt:'Cygnus X-1',                 dw:2.1, tr:0.2},
  {id:'end',     nav:'Event horizon',tgt:'Event horizon',              dw:1.6, tr:0}
];
{ let a = 0; ST.forEach(s => { s.a = a; s.b = a + s.dw; a += s.dw + s.tr; }); }
const NS = ST.length, TT = ST[NS - 1].b;
const IX = Object.fromEntries(ST.map((s, i) => [s.id, i]));
const stAt = T => { let i = NS - 1; while (i > 0 && T < ST[i].a) i--; return i; };
// continuous station coordinate: i + fraction of (dwell + transit)
const coord = T => { const i = stAt(T), s = ST[i], e = i < NS - 1 ? ST[i + 1].a : s.b; return i + Math.min(1, (T - s.a) / Math.max(1e-6, e - s.a)); };
const fromCoord = c => { const i = Math.min(NS - 1, Math.floor(c)), s = ST[i], e = i < NS - 1 ? ST[i + 1].a : s.b; return s.a + (c - i) * (e - s.a); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- content ---------- */
const PROJECTS = {
  mars: {k:'<b>02</b> · Mars · 2017 – 2019 · Shinetech Software, Beijing', h:'A bridge across<br><em>time zones.</em>', r:'Front-End Developer · Remote Team Lead',
    p:'Led a remote front-end team building custom software for international clients, including New York startups. Set the coding standards and the review process, and delivered on time across isolated teams.',
    c:['JavaScript','Responsive UI','Code review','Remote leadership'], l:[['shinetechsoftware.com','https://shinetechsoftware.com']],
    s:'Mars · 1.52 AU from the Sun · one day here lasts 24 h 39 min'},
  jupiter: {k:'<b>04</b> · Jupiter · 2019 – 2021 · Midinote, Hong Kong', h:'Notes that think<br><em>in threads.</em>', r:'Full-Stack Software Engineer · Solo',
    p:'A tag-based note-taking app where notes grow into a living mind map. I built the whole product alone: offline sync, data model, visualisation and the servers underneath.',
    c:['React · Redux','Angular','Node · Express','CouchDB · PouchDB','Nginx','AWS'], l:[['midinote.me','https://midinote.me']],
    s:'Gravity assist · Jupiter bends the path and adds 12 km/s, the same trick both Voyagers used'},
  saturn: {k:'<b>05</b> · Saturn · 2021 – 2024 · Evidence Locker, Beijing', h:'Proof that<br><em>can\'t be touched.</em>', r:'Full-Stack Developer',
    p:'Built with digital-forensics experts for law enforcement and legal teams. Data is acquired from the cloud and preserved in a forensically sound way. Every byte has to hold up in court.',
    c:['React','React Native','Node · Express','Python · Django','PHP','Jest · Cypress','AWS'], l:[['evidencelocker.com','https://evidencelocker.com']],
    s:'Saturn\'s rings · 273,000 km wide, and in most places about 10 m thick'},
  neptune: {k:'<b>06</b> · Neptune · 2024 – 2026 · Camelot Technology, Beijing', h:'Money<br><em>in the pot.</em>', r:'Senior Full-Stack Developer &amp; Team Lead',
    p:'Social wagers between friends: challenge someone to put their money where their mouth is. I led the team building moneyinthepot.com and camelot.fm, from product and web to the services underneath.',
    c:['TypeScript','Next.js','PHP · Laravel · CI','Python','C#'], l:[['moneyinthepot.com','https://moneyinthepot.com'],['camelot.fm','https://camelot.fm']],
    s:'Neptune · 30 AU · winds up to 2,100 km/h, the fastest measured in the Solar System'}
};
const RULES = [
  ['Change little.', 'Land it right.'],
  ['Leave nothing behind.', 'No dead code, no mystery config.'],
  ['See in the dark.', 'Logs, metrics and alerts before launch day.'],
  ['Earn every tool.', 'Learn it deeply. Use it where it pays.'],
  ['Teach what I know.', 'Reviews that teach, standards that outlive me.']
];
const TOOLS = [
  ['Frontend', 'TypeScript · JavaScript · React · Next.js · Redux · React Native · Angular'],
  ['Backend',  'Python · Node.js · PHP · Django · Laravel · Express · C#'],
  ['AI',       'LLMs · RAG pipelines · Inference APIs · ML integration'],
  ['Data',     'PostgreSQL · MySQL · Redis · MongoDB · CouchDB'],
  ['Cloud',    'AWS · Docker · Kubernetes · CI/CD · Nginx · Kafka'],
  ['Quality',  'Code review · Jest · Cypress · Flow']
];
const STATS = [['2017','first release in production'],['4','companies, one mission each'],['2','teams led'],['1','product built solo']];

/* labels: station i, visible window in dwell fractions [f0,f1,f2,f3], anchored to the camera at fa with offset (x,y,d) */
const LAB = [];
const lab = (i, f, fa, x, y, d, html, cls = '') => LAB.push({i, f, fa, x, y, d, html, cls});
const proj = p => `<p class="kick">${p.k}</p><h2>${p.h}</h2><p class="sub">${p.r}</p><p class="p">${p.p}</p><p class="chips">${p.c.map(c => `<span>${c}</span>`).join('')}</p><p class="links">${p.l.map(l => `<a href="${l[1]}" target="_blank" rel="noopener" data-tag="Open ↗">${l[0]} ↗</a>`).join('')}</p><p class="sci">${p.s}</p>`;

lab(IX.earth, [-1, -1, .26, .46], 0, 0, 3.6, 30,
  `<p class="kick">Mission LK-17 · Launched 2017 · <b>Still flying</b></p><h1 class="name">LEI KAI</h1><p class="role">Senior Full-Stack Engineer</p><p class="sci">Night side over Xianyang · 34.3°N 108.7°E · low Earth orbit, 410 km</p>`);

  float hash13(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);

               mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z); }
  float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
  vec2 equi(vec3 d){ return vec2(atan(d.z,d.x)*.15915494+.5, asin(clamp(d.y,-1.,1.))*.31830989+.5); }
  vec2 raySphere(vec3 ro, vec3 rd, vec3 c, float r){ vec3 oc=ro-c; float b=dot(oc,rd); float h=b*b-dot(oc,oc)+r*r; if(h<0.) return vec2(-1.); h=sqrt(h); return vec2(-b-h,-b+h); }
  // Saturn ring optical depth from real ring radii (Saturn radii)
  float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(hash13(vec3(i,1.,1.)),hash13(vec3(i+1.,1.,1.)),f); }
  float ringTau(float r){

  const mix = (o, i, j, k) => lerp(o[ST[i].id], o[ST[j].id], k);

  function stateAt(T) {
    const i = stAt(T), s = ST[i];
    if (T <= s.b || i === NS - 1) return {i, j: i, k: 0, f: (T - s.a) / s.dw, g: -1};
    const g = (T - s.b) / Math.max(1e-6, s.tr), k = smooth(0, 1, g);
    return {i, j: i + 1, k, f: 1 + (T - s.b) / s.dw, g};
  }

  function update(dt) {
    time += dt;
    const k = 1 - Math.exp(-dt * (reduce ? 12 : 4.2));
    T += (tT - T) * k; if (Math.abs(tT - T) < 1e-5) T = tT;
    if (intro < 1) intro = Math.min(1, intro + dt / 5.2 * (scrolled ? 4 : 1));
    fadeIn = Math.max(0, fadeIn - dt / 1.6);
    const st = stateAt(T), id = ST[st.i].id;

    // camera
    pose(T, camera.position, camera.quaternion);
    const ie = 1 - Math.pow(1 - intro, 3), introW = 1 - smooth(0, .5, T);
    if (introW > 0) {
      camera.position.y -= (1 - ie) * .42 * introW;
      parQ.setFromAxisAngle(V(1, 0, 0), -(1 - ie) * .2 * introW); camera.quaternion.multiply(parQ);
    }
    if (!reduce) {
      smx += (mx - smx) * Math.min(1, dt * 2.2); smy += (my - smy) * Math.min(1, dt * 2.2);
      par.set(smy * .028 + Math.sin(time * .21) * .004, -smx * .045 + Math.sin(time * .17) * .005, 0); parQ.setFromEuler(par); camera.quaternion.multiply(parQ);
    }
    camera.updateMatrixWorld();
    speed = lerp(speed, camera.position.distanceTo(lastP) / Math.max(dt, 1e-3), .1); lastP.copy(camera.position);
    fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);

    // near plane follows the closest surface
    let near = 20;
    for (const p of planets) if (p.mesh.visible) near = Math.min(near, Math.max(.02, (camera.position.distanceTo(p.P) - p.reach) * .5));
    if (['belt', 'kuiper', 'helio'].includes(id) || ['belt', 'kuiper', 'helio'].includes(ST[st.j].id)) near = Math.min(near, .05);
    if (Math.abs(camera.near - near) / near > .05) { camera.near = near; camera.updateProjectionMatrix(); }

    // sun direction (constant per station, turned during transits)
    qa.setFromUnitVectors(SUN[ST[st.i].id], SUN[ST[st.j].id]); qb.identity().slerp(qa, st.k);
    sunV.copy(SUN[ST[st.i].id]).applyQuaternion(qb);
    sunLight.position.copy(sunV).multiplyScalar(100).add(camera.position); sunLight.target.position.copy(camera.position);
    const au = Math.exp(lerp(Math.log(AU[ST[st.i].id]), Math.log(AU[ST[st.j].id]), st.k));
    skyMat.uniforms.uSun.value.copy(sunV);
    skyMat.uniforms.uSunR.value = Math.max(.00465 / au, .00042);
    skyMat.uniforms.uSunI.value = au > 400 ? 0 : Math.min(1, 6 / Math.sqrt(au)) * (au > 60 ? lerp(1, .25, clamp((au - 60) / 70)) : 1);
    skyMat.uniforms.uMWGain.value = mix(MW, st.i, st.j, st.k);
    for (const p of planets) {
      const c = coord(T); p.mesh.visible = c >= p.vis[0] && c <= p.vis[1]; p.extra.forEach(e => e.visible = p.mesh.visible);
      if (!p.mesh.visible) continue;
      p.mat.uniforms.uSun.value.copy(sunV); p.mat.uniforms.uTime && (p.mat.uniforms.uTime.value = time);
      p.atm && p.atm.uniforms.uSun.value.copy(sunV);
    }
    cloudMat.uniforms.uSun.value.copy(sunV); cloudMat.uniforms.uTime.value = time;
    ringMat.uniforms.uSun.value.copy(sunV);
    const c = coord(T);
    rockGroups.forEach(g => { const v = c >= g.vis[0] && c <= g.vis[1]; g.meshes.forEach(m => m.visible = v); });
    arro.visible = c > IX.kuiper - .6 && c < IX.kuiper + .7;
    vgr.visible = c > IX.helio - .6 && c < IX.helio + .8;
    if (vgr.visible) vgr.rotation.z = .3 + time * .01;

    // relativity: warp cruise
    let beta = 0;
    if (id === 'warp') beta = .99 * smooth(.04, .38, st.f) * (1 - smooth(.62, .94, st.f));
    const bhMix = smooth(IX.warp + .45, IX.warp + .62, c);
    skyMat.uniforms.uBeta.value = beta; skyMat.uniforms.uFwd.value.copy(fwd);
    starMat.uniforms.uBeta.value = beta; starMat.uniforms.uFwd.value.copy(fwd);
    starMat.uniforms.uGain.value = 1 - bhMix;
    stars.visible = bhMix < 1;
    skyMat.uniforms.uBHMix.value = bhMix;
    if (bhMix > 0) {
      bhMat.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse); bhMat.uniforms.uCamWorld.value.copy(camera.matrixWorld);
      bhMat.uniforms.uCamL.value.copy(camera.position).sub(PB).multiplyScalar(.25);
      bhMat.uniforms.uTime.value = time;
      bhMat.uniforms.uGain.value = lerp(.13, 1, smooth(5, 26, bhMat.uniforms.uCamL.value.length()));
    }
    grade.uniforms.uExp.value = mix(EXPO, st.i, st.j, st.k) * lerp(1, .35, smooth(.1, .8, c - IX.end));
    grade.uniforms.uTime.value = time; grade.uniforms.uFade.value = fadeIn;
    return {st, c, beta};
  }

  /* ---------- text placement ---------- */
  const v3 = V(0, 0, 0);
  function placeLabels() {
    for (const l of LAB) {
      const o = smooth(l.t[0], l.t[1], T) * (1 - smooth(l.t[2], l.t[3], T)) * (l === LAB[0] ? smooth(.42, .85, intro) : 1);
      if (o <= .002) { if (l.vis) { l.el.style.visibility = 'hidden'; l.el.classList.remove('on'); l.vis = false; } continue; }
      v3.copy(l.pos).applyMatrix4(camera.matrixWorldInverse);
      const dist = -v3.z;
      if (dist < .5) { l.el.style.visibility = 'hidden'; l.vis = false; continue; }
      v3.copy(l.pos).project(camera);
      const th = Math.tan(camera.fov * D2R / 2), fx = l.x / l.d / (th * camera.aspect), fy = l.y / l.d / th;
      const nx = lerp(fx, clamp(v3.x, -1.6, 1.6), l.k), ny = lerp(fy, clamp(v3.y, -1.6, 1.6), l.k);
      const x = (nx * .5 + .5) * W, y = (-ny * .5 + .5) * H;
      const sc = clamp(Math.pow(l.d0 / dist, .45 * l.k * 1.6), .86, 1.14);
      if (!l.ox) { l.ox = l.el.offsetWidth / 2; l.oy = l.el.offsetHeight / 2; }
      const ox = l.ox, oy = l.oy;
      l.el.style.transform = `translate3d(${(x - ox).toFixed(1)}px,${(y - oy).toFixed(1)}px,0) scale(${sc.toFixed(3)})`;
      l.el.style.opacity = o.toFixed(3);
      l.el.style.filter = o < .98 ? `blur(${((1 - o) * 7).toFixed(2)}px)` : 'none';
      if (!l.vis) { l.el.style.visibility = 'visible'; l.vis = true; }
      l.el.classList.toggle('on', o > .6);
    }
  }

  /* ---------- telemetry ---------- */
  const el = id => document.getElementById(id);
  const hudK = [el('k0'), el('k1'), el('k2'), el('k3')], hudV = [el('v0'), el('v1'), el('v2'), el('v3')];
  const nf = (x, d) => x.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
  const fmtLight = s => s < 1 ? nf(s * 1000, 1) + ' ms' : s < 60 ? nf(s, 2) + ' s' : s < 3600 ? `${Math.floor(s / 60)} min ${String(Math.floor(s % 60)).padStart(2, '0')} s` : s < 86400 * 3 ? `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')} min` : nf(s / 31557600, s < 31557600 * 10 ? 1 : 0) + ' years';
  const fmtDist = au => au < 1000 ? nf(au, au < 10 ? 2 : 1) + ' AU' : au < 63241 * 1.2 ? nf(au, 0) + ' AU' : nf(au / 63241, 0) + ' ly';
  const routeBtns = [...route.children];
  let lastI = -1, lastHud = 0;
  const lg = (o, k) => Math.exp(lerp(Math.log(o[0]), Math.log(o[1]), k));
  function hud(now, info) {
    const {st, c, beta} = info;
    const ci = Math.min(NS - 1, Math.max(st.i, Math.round(c - .15)));
    if (ci !== lastI) {
      lastI = ci; el('phn').textContent = String(ci + 1).padStart(2, '0'); el('tgt').textContent = ST[ci].tgt;
      routeBtns.forEach((b, k) => { b.classList.toggle('on', k === ci); b.classList.toggle('past', k < ci); });
    }
    $('#bar i').style.width = (T / TT * 100).toFixed(2) + '%';
    const ev = EVT.find(e => { const s = ST[e[0]], f = (T - s.a) / s.dw; return f > e[1] && f < e[2]; });
    const rr = camera.position.distanceTo(PB) / 4;
    const fall = c >= IX.end ? (rr < 1.5 ? 'Inside the photon sphere · light itself orbits here' : rr < 3 ? 'Past the last stable orbit' : '') : '';
    const evt = el('evt'); const txt = ev ? ev[3] : fall || (st.g > .08 && st.g < .92 ? TRANSIT[st.i] : ''); if (txt && evt.textContent !== txt) evt.textContent = txt; evt.style.opacity = txt ? 1 : 0;
    if (now - lastHud < 66) return; lastHud = now;
    const a = TEL[ST[st.i].id], b = TEL[ST[st.j].id];
    let y, r, v, e;
    if (st.g < 0) { const f = clamp(st.f); y = lerp(a.y[0], a.y[1], f); r = lg(a.r, f); v = lerp(a.v[0], a.v[1], smooth(.35, .75, f)); e = lg(a.e, f); }
    else { y = lerp(a.y[1], b.y[0], st.k); r = Math.exp(lerp(Math.log(a.r[1]), Math.log(b.r[0]), st.k)); v = lerp(a.v[1], b.v[0], st.k); e = Math.exp(lerp(Math.log(a.e[1]), Math.log(b.e[0]), st.k)); }
    const bhR = camera.position.distanceTo(PB) / 4;
    if (c >= IX.bh - .05) {
      hudK[0].textContent = 'Year · Earth'; hudV[0].textContent = y.toFixed(2);
      hudK[1].textContent = 'To horizon'; hudV[1].textContent = `${nf(bhR, 1)} Rs · ${nf(bhR * 62.6, 0)} km`;
      hudK[2].textContent = 'Fall speed'; hudV[2].textContent = nf(Math.sqrt(1 / Math.max(bhR, 1)), 3) + ' c';
      hudK[3].textContent = 'Clock rate'; hudV[3].textContent = '×' + nf(Math.sqrt(Math.max(0, 1 - 1 / bhR)), 3);
    } else {
      hudK[0].textContent = 'Year'; hudV[0].textContent = y.toFixed(2);
      hudK[1].textContent = 'From Sun'; hudV[1].textContent = fmtDist(r);
      hudK[2].textContent = 'Velocity'; hudV[2].textContent = beta > .02 ? nf(beta, 3) + ' c' : nf(v, 2) + ' km/s';
      hudK[3].textContent = 'Signal delay'; hudV[3].textContent = fmtLight(e * 499.005);
    }
  }

  /* ---------- loop ---------- */
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const info = update(dt);
    if (skyMat.uniforms.uBHMix.value > 0) { renderer.setRenderTarget(bhRT); renderer.render(bhScene, bhCam); renderer.setRenderTarget(null); }
    composer.render(dt);
    placeLabels(); hud(now, info); cursorFrame(dt);
    requestAnimationFrame(frame);
  }
  function resize() {
    W = innerWidth; H = innerHeight; LAB.forEach(l => l.ox = 0);
    renderer.setSize(W, H, false); composer.setSize(W, H);
    camera.aspect = W / H; camera.fov = mobile ? 66 : 50; camera.updateProjectionMatrix();
    const s = low ? .42 : .6; bhRT.setSize(Math.round(W * DPR * s), Math.round(H * DPR * s));
    skyMat.uniforms.uRes.value.set(W * DPR, H * DPR);
    grade.uniforms.uRes.value.set(W * DPR, H * DPR);
  }
  resize();
  // warm up: compile every program before the curtain lifts
  planets.forEach(p => { p.mesh.visible = true; p.extra.forEach(e => e.visible = true); });
  pose(0, camera.position, camera.quaternion); camera.updateMatrixWorld();
  renderer.compile(scene, camera); renderer.compile(bhScene, bhCam);
  return {
    start() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(frame); },
    resize, skipIntro() { intro = 1; fadeIn = 0; }
  };
}
</script>
</body>
</html>
