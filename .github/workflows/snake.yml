name: snake

# Eats the contribution graph, prints it on old paper and publishes it to the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7a2a17&color_dots=#d8c296,#bf9f6a,#987046,#694829,#38250f

      - name: Print the snake on paper
        # dist/ belongs to the snk container (root), so write to a folder of our own
        run: node .github/snake/compose.mjs dist/snake.svg out

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
          commit_message: Feed the snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
