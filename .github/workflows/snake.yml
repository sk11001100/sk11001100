name: generate snake

on:
  # run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake game from the contribution graph, in light and starlight-dark variants
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2f6fa8&color_dots=#ebedf0,#cfe3f5,#9cc7ea,#5e9fd4,#2f6fa8
            dist/snake-dark.svg?palette=github-dark&color_snake=#a9d9ff&color_dots=#161b22,#0e2a47,#1f4f7a,#4b8cc2,#a9d9ff

      # push the content of dist/ to the `output` branch
      # files are served at https://raw.githubusercontent.com/<user>/<user>/output/<file>
      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
