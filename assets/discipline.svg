<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" width="1200" height="184" role="img" aria-label="Five working principles">
  <defs><style>.sans{font-family:'Segoe UI', -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif}.mono{font-family:Consolas, 'SF Mono', Menlo, 'JetBrains Mono', 'Fira Code', monospace}</style></defs>
  <g transform="translate(0 0)">
    <rect x="0.5" y="0.5" width="223" height="183" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="22" y="0" width="34" height="2" fill="#ff2e63"/>
    <text class="mono" x="22" y="44" font-size="13" fill="#ff2e63" letter-spacing="1">01</text>
    <text class="sans" x="22" y="78" font-size="18" font-weight="700" fill="#f0f6fc">Strike once</text>
    <text class="sans" x="22" y="110" font-size="13.5" fill="#9da7b3">Small pull requests that do one</text>
    <text class="sans" x="22" y="131" font-size="13.5" fill="#9da7b3">thing, land clean, and never</text>
    <text class="sans" x="22" y="152" font-size="13.5" fill="#9da7b3">need a follow-up fix.</text>
  </g>
<g transform="translate(244 0)">
    <rect x="0.5" y="0.5" width="223" height="183" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="22" y="0" width="34" height="2" fill="#ff2e63"/>
    <text class="mono" x="22" y="44" font-size="13" fill="#ff2e63" letter-spacing="1">02</text>
    <text class="sans" x="22" y="78" font-size="18" font-weight="700" fill="#f0f6fc">Leave no trace</text>
    <text class="sans" x="22" y="110" font-size="13.5" fill="#9da7b3">No dead code, no flaky tests,</text>
    <text class="sans" x="22" y="131" font-size="13.5" fill="#9da7b3">no mystery config. The next</text>
    <text class="sans" x="22" y="152" font-size="13.5" fill="#9da7b3">engineer finds only intent.</text>
  </g>
<g transform="translate(488 0)">
    <rect x="0.5" y="0.5" width="223" height="183" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="22" y="0" width="34" height="2" fill="#ff2e63"/>
    <text class="mono" x="22" y="44" font-size="13" fill="#ff2e63" letter-spacing="1">03</text>
    <text class="sans" x="22" y="78" font-size="18" font-weight="700" fill="#f0f6fc">See in the dark</text>
    <text class="sans" x="22" y="110" font-size="13.5" fill="#9da7b3">Logs, metrics and traces designed</text>
    <text class="sans" x="22" y="131" font-size="13.5" fill="#9da7b3">in from the first commit, not</text>
    <text class="sans" x="22" y="152" font-size="13.5" fill="#9da7b3">after the first incident.</text>
  </g>
<g transform="translate(732 0)">
    <rect x="0.5" y="0.5" width="223" height="183" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="22" y="0" width="34" height="2" fill="#ff2e63"/>
    <text class="mono" x="22" y="44" font-size="13" fill="#ff2e63" letter-spacing="1">04</text>
    <text class="sans" x="22" y="78" font-size="18" font-weight="700" fill="#f0f6fc">Sharpen the blade</text>
    <text class="sans" x="22" y="110" font-size="13.5" fill="#9da7b3">Types from the schema to the UI,</text>
    <text class="sans" x="22" y="131" font-size="13.5" fill="#9da7b3">so refactors are safe and</text>
    <text class="sans" x="22" y="152" font-size="13.5" fill="#9da7b3">reviews are fast.</text>
  </g>
<g transform="translate(976 0)">
    <rect x="0.5" y="0.5" width="223" height="183" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="22" y="0" width="34" height="2" fill="#ff2e63"/>
    <text class="mono" x="22" y="44" font-size="13" fill="#ff2e63" letter-spacing="1">05</text>
    <text class="sans" x="22" y="78" font-size="18" font-weight="700" fill="#f0f6fc">Train the next</text>
    <text class="sans" x="22" y="110" font-size="13.5" fill="#9da7b3">Docs, reviews and mentoring</text>
    <text class="sans" x="22" y="131" font-size="13.5" fill="#9da7b3">compound. Shortcuts only</text>
    <text class="sans" x="22" y="152" font-size="13.5" fill="#9da7b3">borrow.</text>
  </g>
</svg>